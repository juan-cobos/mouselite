site_name: MouseLite
site_description: Real-time mouse detection, segmentation and pose estimation.
site_url: https://juan-cobos.github.io/mouselite/
repo_url: https://github.com/juan-cobos/mouselite
repo_name: juan-cobos/mouselite
edit_uri: edit/main/docs/
copyright: Juan Cobos

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Follows the OS by default; the toggle overrides it.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra_css:
  - stylesheets/extra.css

nav:
  - Overview: README.md
  - Quick start: quick-start.md
  - How it works: how-it-works.md
  - Trackers: trackers.md
  - Fine-tuning: training.md
  - CLI reference: cli.md
  - Python API: python-api.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs, src/mouselite]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/juan-cobos/mouselite
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/mouselite/
