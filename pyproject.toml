[project]
name = "mouselite"
version = "0.1.1"
description = "Real-time mouse detection, segmentation and pose estimation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Juan Cobos", email = "juan.cobos@igf.cnrs.fr" }
]
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.27.0",
    "inference-models>=0.39.0",
    "opencv-python>=5.0.0.93",
    "pandas>=2.0.0",
    "rfdetr>=1.9.2",
    "supervision>=0.30.0",
    "tqdm>=4.70.0",
    "trackers>=2.6.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
app = [
    "gradio>=6.0.0",
]
convert = [
    "tables>=3.9.0",
]
train = [
    "rfdetr[train,loggers,visual]",
    "mouselite[convert]",
]

[project.scripts]
mouselite = "mouselite.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.4.2",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
