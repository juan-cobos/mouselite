[project]
name = "mouselite"
version = "0.1.0"
description = "Real-time mouse detection, segmentation and pose estimation."
readme = "README.md"
authors = [
    { name = "Juan Cobos", email = "juan.cobos@igf.cnrs.fr" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mouselite = "mouselite:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
